<script>
window.FLM_PeopleModule = (function () {
  var versions = new WeakMap();
  var tableState = {
    search: '',
    sortCol: 'active',
    sortAsc: false,
    chartMetric: 'active', // 'active' | 'joined_period' | 'last_work_day_period' | 'net_change'
    chartLimit: 12
  };

  function el(tag, text, cls) {
    var elem = document.createElement(tag);
    if (text != null) elem.textContent = text;
    if (cls) elem.className = cls;
    return elem;
  }

  function formatNum(n) {
    return Number(n || 0).toLocaleString('vi-VN');
  }

  function elEscape(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function exportRosterCsv(rows, shifts, station, moduleName, anchorDate, hubCode) {
    var quote = function(value) { var text=String(value==null?'':value);if (/^\s*[=+@\-]/.test(text)) text="'"+text;return '"'+text.replace(/"/g,'""')+'"'; };
    var lines = [['Mã nhân sự','Họ tên','Vị trí','Loại nhân viên','Mã Hub','Hub','Ngày nhận việc','Ngày làm cuối','Trạng thái'].map(quote).join(',')];
    (rows||[]).forEach(function(row) { lines.push([row.employee_id,row.employee_name,row.position,row.contract_type,row.hub_code||hubCode,row.station||station,row.join_date,row.last_work_date,row.status].map(quote).join(',')); });
    var csvContent = '\uFEFF' + lines.join('\r\n');
    var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = (station || 'HUB').replace(/[\/\s]+/g, '_') + '_' + moduleName + '_Roster.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportHubSummaryCsv(rows, isRider, anchor) {
    var header = [
      'STT',
      'Mã Hub',
      'Tên Hub',
      'Đang làm việc',
      'Nhận việc trong kỳ',
      'Nghỉ việc/Làm việc cuối trong kỳ',
      'Biến động ròng',
      'Đã nghỉ trước kỳ',
      'Chưa xác định',
      'Tỷ lệ nghỉ việc (%)',
      'Tỷ lệ nhận việc (%)'
    ];
    var quote = function(v) {
      var s = v == null ? '' : String(v);
      if (/^\s*[=+@\-]/.test(s)) s = "'" + s;
      return '"' + s.replace(/"/g, '""') + '"';
    };
    var lines = [header.map(quote).join(',')];

      var active = Number(r.active || 0);

          if (serial !== id || versions.get(root) !== epoch || !root.isConnected) return;
          open.disabled = more.disabled = false;
          result.replaceChildren();

          if (data.revision !== p.revision) {

        if(!(res.rows||[]).length){var empty=el('td','Không có CTV khớp bộ lọc.');empty.colSpan=8;var line=el('tr');line.append(empty);tbody.append(line);}
        table.append(thead,tbody);result.replaceChildren(table);
        label.textContent='Trang '+(page+1)+' · '+(res.rows||[]).length+' CTV';
        prev.disabled=page===0;next.disabled=!res.nextCursor;find.disabled=false;
      }).withFailureHandler(function(error){
        clearTimeout(timer);
        if(id!==serial||versions.get(root)!==epoch||!root.isConnected)return;
        result.replaceChildren(el('p','Không tải được danh sách: '+String(error.message||error),'flmp-warning'));
        prev.disabled=next.disabled=true;find.disabled=false;
      }).flmPeopleGetEmployees(Object.assign({},request||{},{module:'BPO',scopeType:p.scope&&p.scope.type,scopeValue:p.scope&&p.scope.value,anchorDate:p.anchor,state:status.value,search:query,pageSize:50,cursor:cursors[index]}));
    }
    function reset(){cursors=[null];query=search.value.trim();fetchPage(0);}
    find.onclick=reset;status.onchange=reset;
    search.onkeydown=function(event){if(event.key==='Enter'){event.preventDefault();reset();}};
    prev.onclick=function(){if(page>0)fetchPage(page-1);};
    next.onclick=function(){if(cursors[page+1])fetchPage(page+1);};
    fetchPage(0);
  }

  function render(root, p, request) {
    if(p.module==='BPO'){renderBpo(root,p,request);return;}
    root.replaceChildren();
    root.classList.add('flmp');

    var isRider = p.module === 'RIDER';
    var activeTotal = Number(p.totals.active || 0);
    var joinedTotal = Number(p.totals.joined_period || 0);
    var lastWorkTotal = Number(p.totals.last_work_day_period || 0);
    var unknownTotal = Number(p.totals.unknown_records || 0);
    var exitedTotal = Number(p.totals.exited_before_anchor || 0);
    var netFlow = joinedTotal - lastWorkTotal;

    // Header summary
    var head = el('div', null, 'flmp-head');
    head.append(
      el('h2', isRider ? 'Rider Resource Overview' : 'FTE Resource — Staff Overview', 'flmp-title'),
      el('p', 'Cuối ngày ' + p.anchor + ' · Kỳ theo dõi ' + p.from + ' → ' + p.anchor + ' · ' + (p.hubRows ? p.hubRows.length : 0) + ' Hubs', 'flmp-subtitle')
    );
    root.append(head);

    // Metric Cards
    var cards = el('div', null, 'flmp-cards');
    var cardDefs = [
      {
        key: 'active',
        label: 'Đang làm cuối ngày',
        cls: 'flmp-card-active',
        val: activeTotal,
        sub: 'join_date ≤ ' + p.anchor + ' & chưa nghỉ việc',
        icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
      },
      {
        key: 'joined_period',
        label: 'Nhận việc trong kỳ',
        cls: 'flmp-card-joined',
        val: joinedTotal,
        sub: 'Gia nhập trong 30 ngày vừa qua',
        icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>'
      },
      {
        key: 'last_work_day_period',
        label: 'Ngày làm cuối trong kỳ',
        cls: 'flmp-card-last',
        val: lastWorkTotal,
        sub: 'Nghỉ việc/rời trạm trong 30 ngày',
        icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>'
      },
      {
        key: 'unknown_records',
        label: 'Chưa xác định',
        cls: 'flmp-card-unknown',
        val: unknownTotal,
        sub: 'Hồ sơ thiếu ngày nhận việc/ngày nghỉ',
        icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
      }
    ];

    cardDefs.forEach(function (def) {
      var card = el('div', null, 'flmp-card ' + def.cls);
      card.append(el('div', null, 'flmp-card-bar'));
      var top = el('div', null, 'flmp-card-top');
      top.append(el('span', def.label, 'flmp-card-label'));
      var icon = el('div', null, 'flmp-card-icon');
      icon.innerHTML = def.icon;
      top.append(icon);
      card.append(top);
      card.append(el('strong', formatNum(def.val), 'flmp-card-value'));
      card.append(el('span', def.sub, 'flmp-card-sub'));
      cards.append(card);
    });
    root.append(cards);

    // Flow & Summary Bar
    var flowBar = el('div', null, 'flmp-flow-bar');
    var netPillCls = netFlow > 0 ? 'is-pos' : (netFlow < 0 ? 'is-neg' : 'is-neu');
    var netSign = netFlow > 0 ? '+' : '';
    flowBar.innerHTML = '<div class="flmp-flow-item"><span>Biến động nhân sự ròng (30 ngày):</span>' +
      '<span class="flmp-flow-pill ' + netPillCls + '">' + netSign + formatNum(netFlow) + ' ' + (isRider ? 'Rider' : 'Nhân sự') + '</span></div>' +
      '<div class="flmp-flow-item"><span>Tỷ lệ biến động (Turnover rate):</span>' +
      '<span class="flmp-flow-pill is-neu">' + (activeTotal > 0 ? ((lastWorkTotal / activeTotal) * 100).toFixed(1) : 0) + '%</span></div>' +
      '<div class="flmp-flow-item" style="color:#64748b;font-size:12px;">' +
      '<span>Quy tắc: ' + (p.dateRule || 'Ngày làm cuối vẫn tính đang làm; hôm sau tính đã nghỉ.') + '</span></div>';
    root.append(flowBar);

    // Collapsible Warnings / Source Note
    if (p.warnings && p.warnings.length) {
      var noticeAccordion = el('details', null, 'flmp-notice-accordion');
      var summary = el('summary', null, 'flmp-notice-summary');
      summary.innerHTML = '<span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:6px;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' +
        'Ghi chú nguồn dữ liệu & lưu ý quy tắc (' + p.warnings.length + ')</span><small>Bấm để xem</small>';
      noticeAccordion.append(summary);
      var bodyNotices = el('div', null, 'flmp-notice-body');
      var ul = el('ul');
      p.warnings.forEach(function (w) {
        ul.append(el('li', w));
      });
      bodyNotices.append(ul);
      noticeAccordion.append(bodyNotices);
      root.append(noticeAccordion);
    }

    var rows = p.hubRows || [];
    if (!rows.length) {
      var emptyBox = el('div', null, 'flmp-empty');
      emptyBox.append(
        el('b', 'Không có dữ liệu khớp scope/ngày đã chọn'),
        el('p', 'Kiểm tra phân quyền Hub hoặc nguồn dữ liệu đã được nạp.')
      );
      root.append(emptyBox);
      return;
    }

    // Interactive Analytics Section (Top Hubs Bar Chart + Workforce Composition)
    var analytics = el('div', null, 'flmp-analytics');

    // Chart Box 1: Top Hubs Comparison
    var chartBox = el('div', null, 'flmp-chart-box');
    var chartHead = el('div', null, 'flmp-chart-head');
    chartHead.append(el('h4', 'Phân tích Top Hub theo số lượng', 'flmp-chart-title'));

    var tabs = el('div', null, 'flmp-chart-tabs');
    var tabConfigs = [
      { key: 'active', label: 'Đang làm' },
      { key: 'joined_period', label: 'Nhận việc' },
      { key: 'last_work_day_period', label: 'Ngày làm cuối' },
      { key: 'net_change', label: 'Tăng trưởng ròng' }
    ];
    tabConfigs.forEach(function (tc) {
      var btn = el('button', tc.label, 'flmp-chart-tab' + (tableState.chartMetric === tc.key ? ' is-active' : ''));
      btn.onclick = function () {
        tableState.chartMetric = tc.key;
        renderAnalyticsBars();
      };
      tabs.append(btn);
    });
    chartHead.append(tabs);
    chartBox.append(chartHead);

    var barsContainer = el('div', null, 'flmp-bars-container');
    chartBox.append(barsContainer);
    analytics.append(chartBox);

    function renderAnalyticsBars() {
      tabs.querySelectorAll('.flmp-chart-tab').forEach(function (t, i) {
        t.classList.toggle('is-active', tabConfigs[i].key === tableState.chartMetric);
      });
      barsContainer.replaceChildren();

      var metric = tableState.chartMetric;
      var sortedRows = rows.slice().map(function (r) {
        var v = metric === 'net_change' ? (Number(r.joined_period || 0) - Number(r.last_work_day_period || 0)) : Number(r[metric] || 0);
        return { row: r, val: v, station: r.station };
      }).sort(function (a, b) {
        if (metric === 'net_change') return b.val - a.val;
        if (b.val !== a.val) return b.val - a.val;
        return a.station.localeCompare(b.station);
      }).slice(0, tableState.chartLimit || 12);

      var maxVal = Math.max.apply(null, [1].concat(sortedRows.map(function (x) { return Math.abs(x.val); })));

      sortedRows.forEach(function (item) {
        var row = el('div', null, 'flmp-bar-row');
        row.title = 'Bấm để xem chi tiết Hub ' + item.station;
        row.onclick = function () {
          openHubModal(root, item.row, p);
        };

        var name = el('span', item.station, 'flmp-bar-name');
        var track = el('div', null, 'flmp-bar-track');
        var fill = el('div', null, 'flmp-bar-fill');
        var pct = Math.max(3, Math.min(100, Math.round((Math.abs(item.val) / maxVal) * 100)));
        fill.style.width = pct + '%';

        if (metric === 'net_change') {
          fill.style.background = item.val >= 0 ? '#00875a' : '#de350b';
        } else if (metric === 'joined_period') {
          fill.style.background = '#00875a';
        } else if (metric === 'last_work_day_period') {
          fill.style.background = '#ff8b00';
        } else {
          fill.style.background = '#0052cc';
        }

        track.append(fill);
        var valSign = metric === 'net_change' && item.val > 0 ? '+' : '';
        var val = el('span', valSign + formatNum(item.val), 'flmp-bar-val');
        if (metric === 'net_change') {
          val.style.color = item.val >= 0 ? '#00875a' : '#de350b';
        }

        row.append(name, track, val);
        barsContainer.append(row);
      });
    }

    // Chart Box 2: Workforce Composition
    var compBox = el('div', null, 'flmp-chart-box');
    compBox.innerHTML = '<div class="flmp-chart-head"><h4 class="flmp-chart-title">Cơ cấu trạng thái nhân sự</h4></div>';

    var totalRecords = activeTotal + exitedTotal + unknownTotal;
    var activePct = totalRecords > 0 ? Math.round((activeTotal / totalRecords) * 100) : 0;
    var exitedPct = totalRecords > 0 ? Math.round((exitedTotal / totalRecords) * 100) : 0;
    var unknownPct = totalRecords > 0 ? Math.round((unknownTotal / totalRecords) * 100) : 0;

    var compBars = el('div', null, 'flmp-comp-bars');
    compBars.innerHTML = '<div class="flmp-comp-stack">' +
      '<div class="flmp-comp-slice" style="width:' + activePct + '%;background:#0052cc;" title="Đang làm: ' + activePct + '%"></div>' +
      '<div class="flmp-comp-slice" style="width:' + exitedPct + '%;background:#ff8b00;" title="Đã nghỉ trước kỳ: ' + exitedPct + '%"></div>' +
      '<div class="flmp-comp-slice" style="width:' + unknownPct + '%;background:#6554c0;" title="Chưa xác định: ' + unknownPct + '%"></div>' +
      '</div>';

    var compLegend = el('div', null, 'flmp-comp-legend');
    compLegend.innerHTML = '<div class="flmp-comp-item"><span><i class="flmp-comp-dot" style="background:#0052cc;"></i>Đang làm việc:</span>' +
      '<b>' + formatNum(activeTotal) + ' (' + activePct + '%)</b></div>' +
      '<div class="flmp-comp-item"><span><i class="flmp-comp-dot" style="background:#ff8b00;"></i>Đã nghỉ trước kỳ:</span>' +
      '<b>' + formatNum(exitedTotal) + ' (' + exitedPct + '%)</b></div>' +
      '<div class="flmp-comp-item"><span><i class="flmp-comp-dot" style="background:#6554c0;"></i>Chưa xác định:</span>' +
      '<b>' + formatNum(unknownTotal) + ' (' + unknownPct + '%)</b></div>' +
      '<div style="margin-top:14px;padding-top:10px;border-top:1px dashed #e2e8f0;" class="flmp-comp-item">' +
      '<span>Tổng hồ sơ ghi nhận:</span><strong>' + formatNum(totalRecords) + '</strong></div>';

    compBox.append(compBars, compLegend);
    analytics.append(compBox);

    root.append(analytics);
    renderAnalyticsBars();

    // If a single Hub is selected, render the authentic Hub Roster Table directly on the page!
    if (rows.length === 1) {
      var singleHubBox = el('div', null, 'flmp-single-hub-section');
      var singleCodeDisplay = rows[0].hubCode || rows[0].stationCode ? ' <span style="font-size:14px;color:#64748b;font-weight:normal;">(' + elEscape(rows[0].hubCode || rows[0].stationCode) + ')</span>' : '';
      singleHubBox.innerHTML = '<div class="flmp-table-head" style="margin:24px 0 14px 0;padding-bottom:10px;border-bottom:1px solid #e2e8f0;">' +
        '<h3 class="flmp-table-title" style="font-size:16px;font-weight:700;color:#0b2343;margin:0 0 4px 0;">' +
        (isRider ? '👥 Bảng hiển thị danh sách Rider tại Hub ' : '👥 Bảng hiển thị danh sách Staff (FTE) tại Hub ') + elEscape(rows[0].station) + singleCodeDisplay + '</h3>' +
        '<p style="color:#64748b;font-size:12px;margin:0;">' +
        (isRider ? 'Hồ sơ Rider, ngày nhận việc và ngày làm cuối từ tab riders trong backend' : 'Nhân sự thuộc Hub từ tab staff, đã loại các vị trí Rider, gồm vị trí và ngày nhận/nghỉ việc') +
        '</p></div>';
      root.append(singleHubBox);
      createRosterView(singleHubBox, rows[0], p, (p.roster && p.roster.rows) || null);
      return;
    }

    // Toolbar (Search + Hub count)
    var toolbar = el('div', null, 'flmp-toolbar');
    var searchBox = el('div', null, 'flmp-search-box');
    searchBox.innerHTML = '<svg class="flmp-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>';
    var searchInput = el('input');
    searchInput.type = 'text';
    searchInput.placeholder = 'Tìm nhanh Hub (bấm vào dòng để xem chi tiết)…';
    searchInput.value = tableState.search || '';
    searchBox.append(searchInput);

    var countBadge = el('span', 'Hiển thị ' + rows.length + ' Hubs (Bấm dòng để xem chi tiết)', 'flmp-count-badge');
    var exportSummaryBtn = el('button', null, 'flmp-roster-export app-btn-export');
    exportSummaryBtn.id = 'flmpExportHubSummary';
    exportSummaryBtn.innerHTML = '<svg class="app-btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Xuất dữ liệu Hubs (CSV)';
    exportSummaryBtn.onclick = function () {
      exportHubSummaryCsv(rows, isRider, p.anchor);
    };
    toolbar.append(searchBox, countBadge, exportSummaryBtn);
    root.append(toolbar);

    // Table container
    var tableWrap = el('div', null, 'flmp-scroll');
    root.append(tableWrap);

    function updateTable() {
      var q = (tableState.search || '').trim().toLowerCase();
      var filtered = rows.filter(function (r) {
        if (!q) return true;
        return String(r.station || '').toLowerCase().indexOf(q) !== -1;
      });

      countBadge.textContent = 'Hiển thị ' + filtered.length + ' / ' + rows.length + ' Hubs (Bấm dòng để xem chi tiết)';

      var col = tableState.sortCol || 'active';
      var asc = tableState.sortAsc === true;
      filtered.sort(function (a, b) {
        if (col === 'station') {
          return asc ? String(a.station).localeCompare(String(b.station)) : String(b.station).localeCompare(String(a.station));
        }
        var va = Number(a[col] || 0), vb = Number(b[col] || 0);
        return asc ? va - vb : vb - va;
      });

      tableWrap.replaceChildren();
      var table = el('table');
      var head = el('thead');
      var htr = el('tr');
      var cols = [
        ['station', 'Hub'],
        ['active', 'Đang làm'],
        ['joined_period', 'Nhận việc'],
        ['last_work_day_period', 'Ngày làm cuối'],
        ['exited_before_anchor', 'Đã nghỉ trước kỳ'],
        ['unknown_records', 'Chưa xác định'],
        ['action', 'Thao tác']
      ];

      cols.forEach(function (c) {
        var th = el('th', c[1]);
        if (c[0] !== 'action' && tableState.sortCol === c[0]) {
          th.classList.add('is-sorted');
          var arrow = el('span', tableState.sortAsc ? ' ▲' : ' ▼', 'sort-arrow');
          th.append(arrow);
        }
        if (c[0] !== 'action') {
          th.onclick = function () {
            if (tableState.sortCol === c[0]) {
              tableState.sortAsc = !tableState.sortAsc;
            } else {
              tableState.sortCol = c[0];
              tableState.sortAsc = c[0] === 'station';
            }
            updateTable();
          };
        }
        htr.append(th);
      });
      head.append(htr);
      table.append(head);

      var body = el('tbody');
      if (!filtered.length) {
        var emptyTr = el('tr');
        var emptyTd = el('td', 'Không tìm thấy Hub nào phù hợp với từ khóa "' + q + '"');
        emptyTd.colSpan = cols.length;
        emptyTd.style.textAlign = 'center';
        emptyTd.style.padding = '30px';
        emptyTr.append(emptyTd);
        body.append(emptyTr);
      } else {
        filtered.forEach(function (r) {
          var tr = el('tr', null, 'flmp-row');
          tr.title = 'Bấm để xem phân tích & danh sách nhân sự Hub ' + r.station;
          tr.onclick = function () {
            openHubModal(root, r, p);
          };

          cols.forEach(function (c) {
            if (c[0] === 'action') {
              var td = el('td');
              var btn = el('button', 'Xem chi tiết', 'flmp-action-btn');
              btn.onclick = function (ev) {
                ev.stopPropagation();
                openHubModal(root, r, p);
              };
              td.append(btn);
              tr.append(td);
            } else {
              tr.append(el('td', c[0] === 'station' ? r[c[0]] : formatNum(r[c[0]])));
            }
          });
          body.append(tr);
        });
      }
      table.append(body);

      // Footer total row
      var foot = el('tfoot');
      var ftr = el('tr');
      cols.forEach(function (c) {
        if (c[0] === 'station') {
          ftr.append(el('td', 'Tổng (' + filtered.length + ' Hubs)'));
        } else if (c[0] === 'action') {
          ftr.append(el('td', ''));
        } else {
          var sum = filtered.reduce(function (acc, r) { return acc + Number(r[c[0]] || 0); }, 0);
          ftr.append(el('td', formatNum(sum)));
        }
      });
      foot.append(ftr);
      table.append(foot);

      tableWrap.append(table);
    }

    searchInput.oninput = function () {
      tableState.search = searchInput.value;
      updateTable();
    };

    updateTable();

    if (p.canViewEmployeeDetails === true) {
      details(root, p, request);
    }
  }

  function load(root, module, request, onDone, onError) {
    if (!(root instanceof Element)) throw Error('Missing host container');
    var seq = (versions.get(root) || 0) + 1;
    versions.set(root, seq);

    root.replaceChildren();
    root.classList.add('flmp');
    var loadingBox = el('div', null, 'flmp-loading');
    loadingBox.append(
      el('div', null, 'flmp-spinner'),
      el('p', 'Đang tải dữ liệu phân tích nhân sự ' + (module === 'RIDER' ? 'Rider' : module === 'BPO' ? 'Outsource (BPO)' : 'FTE') + '…')
    );
    root.append(loadingBox);

    var timer = setTimeout(function () {
      if (versions.get(root) === seq) {
        versions.set(root, seq + 1);
        root.replaceChildren(el('div', 'Truy vấn chưa hoàn tất. Vui lòng bấm "Làm mới dữ liệu" để thử lại.', 'flmp-warning'));
      }
    }, 40000);

    google.script.run
      .withSuccessHandler(function (p) {
        clearTimeout(timer);
        if (versions.get(root) !== seq || !root.isConnected) return;
        render(root, p, request);
        if (typeof onDone === 'function') onDone(p);
      })
      .withFailureHandler(function (e) {
        clearTimeout(timer);
        if (versions.get(root) !== seq || !root.isConnected) return;
        var errBox = el('div', null, 'flmp-warning');
        errBox.textContent = 'Không tải được: ' + String(e.message || e);
        root.replaceChildren(errBox);
        if (typeof onError === 'function') onError(e);
      })
      .flmPeopleGetResource(Object.assign({}, request, { module: module }));
  }

  // Keyboard shortcut: Esc to close modal
  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeHubModal();
  });

  return {
    render: render,
    load: load,
    openHubDetail: openHubModal,
    cancel: function (root) {
      if (root instanceof Element) versions.set(root, (versions.get(root) || 0) + 1);
      closeHubModal();
    }
  };
})();
</script>
