  <script>// Runs before the main UI so syntax errors and incomplete imports stay visible.
(function(){
  var timer,failed=false;
  function failure(message){
    failed=true;clearTimeout(timer);
    var root=document.getElementById('root');if(!root)return;
    root.replaceChildren();
    var card=document.createElement('section');
    card.style.cssText='max-width:620px;margin:64px auto;padding:28px;background:#fff;border:1px solid #dfe7f1;border-radius:12px;color:#18304e;font:14px/1.6 Arial,sans-serif';
    var title=document.createElement('h2');title.textContent='Workspace could not start';
    var detail=document.createElement('p');detail.textContent=String(message||'Unknown startup error');detail.style.overflowWrap='anywhere';
    var help=document.createElement('p');help.textContent='Check that Index, Styles, Theme and Javascript are replaced together in the same Apps Script project, then deploy a new version.';
    var retry=document.createElement('button');retry.textContent='Reload workspace';retry.style.cssText='padding:10px 16px;border:0;border-radius:6px;background:#173b60;color:white;font:600 13px Arial;cursor:pointer';retry.onclick=function(){location.reload()};
    card.append(title,detail,help,retry);root.appendChild(card);
  }
  window.addEventListener('error',function(event){if(event.error||event.message)failure(event.message||event.error.message)});
  window.addEventListener('unhandledrejection',function(event){failure(event.reason&&event.reason.message||event.reason)});
  timer=setTimeout(function(){
    var root=document.getElementById('root');
    if(!failed&&root&&(root.querySelector('[data-spx-startup]')||root.querySelector('.boot-screen')))failure('Startup did not finish within 45 seconds. The Javascript include may be missing, or the server did not respond.');
  },45000);
})();
</script>
