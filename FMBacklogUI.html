<script>
(function(){
  'use strict';
  var tracker={scope:'allhubs',metric:'focus',channel:'mp',compare:'morning',zone:'ALL',search:'',limit:15,page:1,pageSize:15};
  var detail={mode:'channels',channel:'mp',zone:'ALL',search:'',limit:15,page:1,pageSize:15};
  var channels={mp:'MP · Marketplace',rv:'RV · Reverse',nss:'NSS · Social'};
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function number(v){if(v==null||String(v).trim()===''||v==='—'||v==='-')return null;var n=Number(String(v).replace(/,/g,''));return isFinite(n)?n:null}
  function display(v){var n=number(v);return n==null?'<span class="fmt-missing">—</span>':'<span'+(n===0?' class="fmt-zero"':'')+'>'+n.toLocaleString('en-US')+'</span>'}
  function normalized(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().trim()}
  function sum(rows,fn){return rows.reduce(function(total,row){var v=number(fn(row));return total==null&&v==null?null:(total||0)+(v||0)},null)}
  function getData(){return window.FM_BACKLOG_DATA||{}}
  function zoneRows(){return (getData().zoneRows||[]).filter(function(r){return r.zone!=='FLM HCM'})}
  function match(row,s){var q=normalized(s.search);return (s.zone==='ALL'||row.zone===s.zone)&&(!q||normalized((row.hubName||'')+' '+row.zone).includes(q))}
  function delta(current,before){var c=number(current),b=number(before);if(c==null||b==null)return '<span class="fmt-missing">—</span>';if(b===0)return c===0?'<span class="fmt-delta is-flat">0%</span>':'<span class="fmt-delta is-flat" title="No percentage baseline: previous value is 0">From 0</span>';var pct=Math.round((c-b)/b*100);return '<span class="fmt-delta '+(pct>0?'is-up':pct<0?'is-down':'is-flat')+'">'+(pct>0?'+':'')+pct+'%'+(pct>0?' ↑':pct<0?' ↓':'')+'</span>'}
  function changeState(value){var n=number(value);return n==null?'':n>0?'is-up':n<0?'is-down':'is-flat'}
  function signedCount(value){var n=number(value);return (n>0?'+':'')+display(value)}
  function changeCount(current,before){var c=number(current),b=number(before);if(c==null||b==null)return display(null);var diff=c-b;return '<span class="fmt-delta '+changeState(diff)+'" title="'+(diff>0?'Backlog increased':diff<0?'Backlog decreased':'No change')+'">'+signedCount(diff)+'</span>'}
  function legend(){return '<div class="fmt-legend fmt-note" aria-label="Backlog change colours"><span><i class="is-up" aria-hidden="true">↑</i> Backlog increased</span><span><i class="is-down" aria-hidden="true">↓</i> Backlog decreased</span><span>0 · No change</span></div>'}
  function pct(v){var n=parseFloat(v);return isFinite(n)?n:null}
  function options(rows,selected){return '<option value="ALL">All zones</option>'+Array.from(new Set(rows.map(function(r){return r.zone}))).sort().map(function(z){return '<option value="'+esc(z)+'"'+(z===selected?' selected':'')+'>'+esc(z)+'</option>'}).join('')}
  function button(label,attr,value,active){return '<button type="button" '+attr+'="'+esc(value)+'" aria-pressed="'+String(active===value)+'">'+esc(label)+'</button>'}

  function exportTracker(hubs,zones){var ch=['mp','rv','nss'],header=['Scope','Rank','Zone','HUB'].concat(fields(ch),['Total ≥2d','Morning ≥4d','Current ≥4d','D0 ≥4d','D−1 ≥4d','W0 ≥4d','W−1 ≥4d','Scope share ≥4d','Cumulative share']),rows=[header];zones.concat(hubs).forEach(function(r){rows.push([r.hubName?(r.isPriority?'Priority HUB':'HUB'):'Zone',r.rank,r.zone,r.hubName].concat(channelValues(r,ch),[r.totalCombine,(r.d0MorningNow||{}).morning,(r.d0MorningNow||{}).now,(r.d0VsDMinus1||{}).d0,(r.d0VsDMinus1||{}).dMinus1,(r.w0VsWMinus1||{}).w0,(r.w0VsWMinus1||{}).wMinus1,r.sharePct,r.cumulativePct]))});download(rows,'FM_Pending_PU_Filtered_Snapshot.csv')}
  function exportDetails(hubs,mode){var ch=mode==='channels'?['mp','rv','nss']:['nonPreorder','preorder'];download([['Zone','HUB'].concat(fields(ch),['Combined ≥2d'])].concat(hubs.map(function(r){return [r.zone,r.hubName].concat(channelValues(r,ch),[mode==='channels'?r.totalCombine:r.preorderCombine])})),'FM_HUB_'+mode+'_Filtered_Snapshot.csv')}
})();
</script>
